<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Banner Next, please!</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css">
<style>
  /* Fuente del banner que se convierte en imagen (moodle/banner.png), 1200 × 400 */
  html, body { margin: 0; width: 1200px; height: 400px; overflow: hidden; }
  body { font-family: 'Nunito', sans-serif; }
  .b { position: relative; width: 1200px; height: 400px; overflow: hidden; box-sizing: border-box;
       background: radial-gradient(circle at 78% 30%, #2f6fd1 0%, #1a4a96 45%, #0e2c62 100%); color: #fff; }
  /* Pista y avión de fondo */
  .sky i { position: absolute; color: rgba(255, 255, 255, .07); }
  .stripe { position: absolute; left: 0; right: 0; bottom: 0; height: 14px; background: #ffc72c; box-shadow: 0 -4px 0 #0e2c62; }
  .runway { position: absolute; left: 0; right: 0; bottom: 14px; height: 6px; background: repeating-linear-gradient(90deg, rgba(255,255,255,.35) 0 60px, transparent 60px 110px); }
  .logo { position: absolute; left: 46px; top: 38px; width: 330px; filter: drop-shadow(0 10px 18px rgba(0, 0, 0, .35)); }
  .txt { position: absolute; left: 420px; top: 52px; right: 48px; }
  .kick { display: inline-flex; align-items: center; gap: 8px; background: #ffc72c; color: #0e2c62; font-family: 'Fredoka'; font-weight: 600;
          font-size: 19px; padding: 6px 16px; border-radius: 999px; box-shadow: 0 3px 0 #b8860b; }
  h1 { font-family: 'Fredoka'; font-weight: 700; font-size: 50px; line-height: 1.05; margin: 18px 0 10px; text-shadow: 0 3px 0 rgba(0, 0, 0, .25); }
  p { font-size: 21px; line-height: 1.4; margin: 0 0 22px; color: #dbe7ff; font-weight: 600; max-width: 700px; }
  .row { display: flex; align-items: center; gap: 22px; }
  .btn { display: inline-flex; align-items: center; gap: 10px; font-family: 'Fredoka'; font-weight: 600; font-size: 30px; color: #fff;
         background: linear-gradient(#3fcf7c, #22a259 60%, #188548); border: 4px solid #0e2c62; border-radius: 18px; padding: 10px 28px;
         box-shadow: 0 7px 0 #0e2c62, 0 14px 24px rgba(0, 0, 0, .35); }
  .url { font-size: 17px; color: #b9cff2; font-weight: 700; }
  .url b { color: #fff; }
  .chips { display: flex; gap: 10px; margin-top: 6px; }
  .chips span { font-size: 15px; font-weight: 800; background: rgba(255, 255, 255, .12); border: 2px solid rgba(255, 255, 255, .25); padding: 4px 12px; border-radius: 999px; }
</style>
</head>
<body>
  <div class="b">
    <div class="sky">
      <i class="mdi mdi-airplane" style="font-size:420px; right:-60px; top:-70px; transform:rotate(-18deg)"></i>
      <i class="mdi mdi-cloud" style="font-size:120px; left:330px; top:250px"></i>
      <i class="mdi mdi-cloud" style="font-size:80px; right:330px; top:290px"></i>
    </div>
    <img class="logo" src="../assets/logo-512.png" alt="Next, please!">
    <div class="txt">
      <span class="kick"><i class="mdi mdi-gamepad-variant"></i> Simulador · Billetaje y reservas</span>
      <h1>¡Atendé el check-in y embarcá el vuelo!</h1>
      <p>Revisá documentos, despachá valijas, resolvé imprevistos y embarcá pasajeros en Ezeiza con Aeroplata.</p>
      <div class="row">
        <span class="btn"><i class="mdi mdi-play-circle"></i> Jugar ahora</span>
        <div>
          <div class="url">Desde la compu o el celu</div>
          <div class="url"><b>facundo-villafane.github.io/next-please</b></div>
        </div>
      </div>
    </div>
    <div class="runway"></div>
    <div class="stripe"></div>
  </div>
</body>
</html>
